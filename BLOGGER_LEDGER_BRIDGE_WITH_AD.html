<!--
  VyaparOS Public Ledger – Blogger Bridge + Advertisement
  Blogger Page URL:
  https://www.sanglibusiness.in/p/ledger.html

  CHANGE THESE 2 VALUES whenever the admin wants to change the advertisement:
  1) AD_IMAGE_URL
  2) AD_DESTINATION_URL

  The page reads the public ledger token from ?t=...&s=pr and keeps it for the
  "View Ledger" button. It does NOT auto-redirect, so the advertisement is visible first.
-->
<script>
  const AD_IMAGE_URL = ''; // Example: https://your-cdn.com/vyaparos-ad.jpg
  const AD_DESTINATION_URL = 'https://vyaparos-app.vercel.app/'; // Replace with Play Store URL when available
</script>

<div id="vy-ledger-bridge" style="min-height:100vh;background:#f1f5f9;padding:14px 10px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;box-sizing:border-box;">
  <div style="width:100%;max-width:520px;margin:0 auto;">
    <div style="background:#fff;border:1px solid #dbe3ee;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.08);">
      <div style="padding:13px 14px;border-bottom:1px solid #e2e8f0;text-align:center;">
        <div style="font-size:20px;font-weight:800;letter-spacing:-.02em;">VyaparOS</div>
        <div style="font-size:11px;color:#64748b;margin-top:3px;">Smart Business &amp; Digital Khata</div>
      </div>

      <a id="vy-ad-link" href="#" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;">
        <div id="vy-ad-image-wrap" style="background:#e0f2fe;overflow:hidden;">
          <!-- Uploaded advertisement image is inserted here when AD_IMAGE_URL is set. -->
          <div id="vy-default-ad" style="padding:22px 18px;background:linear-gradient(135deg,#e0f2fe,#eef2ff 55%,#f5f3ff);">
            <div style="font-size:11px;font-weight:800;color:#2563eb;letter-spacing:.08em;text-transform:uppercase;">VyaparOS</div>
            <div style="font-size:23px;line-height:1.1;font-weight:900;color:#0f172a;margin-top:5px;">Your Khata.<br/>Simplify Your Business!</div>
            <div style="font-size:12px;color:#475569;margin-top:8px;">Digital billing • Ledger • Payments • Business management</div>
            <div style="display:inline-block;margin-top:13px;background:#2563eb;color:#fff;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:800;">Open VyaparOS</div>
          </div>
          <img id="vy-ad-image" alt="VyaparOS Advertisement" style="display:none;width:100%;height:auto;max-height:190px;object-fit:cover;" />
        </div>
      </a>

      <div style="padding:16px 14px 18px;text-align:center;">
        <div style="font-size:12px;color:#64748b;">Your customer ledger is ready.</div>
        <a id="vy-view-ledger" href="#" style="display:block;margin-top:11px;background:linear-gradient(100deg,#38bdf8,#3b82f6,#8b5cf6);color:#fff;text-decoration:none;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:800;">View Customer Ledger</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('t') || '';
  var mode = params.get('s') || 'pr';
  var ledgerUrl = token
    ? 'https://vyaparos-app.vercel.app/t/' + encodeURIComponent(token) + '?s=' + encodeURIComponent(mode)
    : 'https://vyaparos-app.vercel.app/';

  var adLink = document.getElementById('vy-ad-link');
  var adImage = document.getElementById('vy-ad-image');
  var defaultAd = document.getElementById('vy-default-ad');
  var viewLedger = document.getElementById('vy-view-ledger');

  adLink.href = AD_DESTINATION_URL || '#';
  viewLedger.href = ledgerUrl;

  if (AD_IMAGE_URL) {
    adImage.src = AD_IMAGE_URL;
    adImage.style.display = 'block';
    defaultAd.style.display = 'none';
  }
})();
</script>
